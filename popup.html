<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Auto-Send</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup-header">
    <span class="logo-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.4 10.3 16 4.7c.6-.3 1.2.3.9.9l-5.6 12.6c-.3.6-1.2.5-1.3-.2l-.9-5-5-1c-.7-.1-.8-1-.2-1.3Z" fill="currentColor"/>
        <path d="m9.2 12.8 2.7-2.7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <div class="logo-text">
      <span class="logo-name">Auto-Send</span>
      <span class="logo-sub">for ChatGPT uploads</span>
    </div>
  </header>

  <main class="popup-body">
    <p>The small Auto button appears beside Send only while a file upload is still pending.</p>
    <ol class="steps">
      <li>Attach a file in ChatGPT.</li>
      <li>Type your prompt while it uploads.</li>
      <li>Click Auto. It sends once the upload finishes.</li>
    </ol>
  </main>

  <footer class="popup-footer">
    <span class="version" id="ext-version"></span>
    <span>Runs only on ChatGPT</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
